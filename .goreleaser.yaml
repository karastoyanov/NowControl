version: 2

project_name: nowctl

before:
  hooks:
    - go mod tidy

builds:
  - id: nowctl
    main: .
    binary: nowctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}}

archives:
  - id: nowctl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: nowctl
    package_name: nowctl
    formats:
      - deb
    maintainer: Aleksandar Karastoyanov <karastoqnov.alexandar@gmail.com>
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: karastoyanov
    name: NowControl
  header: |
    ## nowctl v{{ .Version }}

    **New:**
    - `table describe <table>` -- lists a table's fields via
      `sys_dictionary`, including fields inherited from parent tables in
      the class hierarchy (e.g. `incident` inherits `number`,
      `short_description`, `state`, etc. from `task`). Field types and
      reference targets are shown as display values (e.g. "Reference",
      "Configuration Item"). Supports `--format`/`--output` like
      `table list`.
    - `nowctl doctor` -- checks the config file (exists? permissions
      `0600`?), resolved instance/username, whether a password is
      stored, and live authentication against the instance, printing an
      `OK`/`FAIL` line per check and exiting non-zero if anything failed.
  footer: |
    ---
    Full usage reference: [docs/USAGE.md](https://github.com/karastoyanov/NowControl/blob/v{{ .Version }}/docs/USAGE.md)

brews:
  - name: nowctl
    repository:
      owner: karastoyanov
      name: NowControl
      branch: master
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: Aleksandar Karastoyanov
      email: karastoqnov.alexandar@gmail.com
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0
    install: |
      bin.install "nowctl"
    test: |
      system "#{bin}/nowctl --version"
