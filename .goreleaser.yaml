version: 2

project_name: nowctl

before:
  hooks:
    - go mod tidy

builds:
  - id: nowctl
    main: .
    binary: nowctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: nowctl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: nowctl
    package_name: nowctl
    formats:
      - deb
    maintainer: Aleksandar Karastoyanov <karastoqnov.alexandar@gmail.com>
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: karastoyanov
    name: NowControl
  header: |
    ## nowctl v{{ .Version }}

    Install/update tooling improvements only -- no CLI behavior changes in
    this release.

    **New:**
    - Self-hosted, signed apt repository -- `apt install`/`apt upgrade`
      now works for real instead of manually re-downloading a `.deb` each
      time. See the [Debian/Ubuntu install instructions](https://github.com/karastoyanov/NowControl#installation).

    **Changed:**
    - The Homebrew formula now lives in this repo (`homebrew` branch)
      instead of a separate `homebrew-tap` repo. Install is now a
      two-step tap: `brew tap karastoyanov/nowctl https://github.com/karastoyanov/NowControl && brew install nowctl`.
      Already-tapped users: re-tap with that command, then `brew upgrade nowctl`.
  footer: |
    ---
    Full usage reference: [docs/USAGE.md](https://github.com/karastoyanov/NowControl/blob/v{{ .Version }}/docs/USAGE.md)

brews:
  - name: nowctl
    repository:
      owner: karastoyanov
      name: NowControl
      branch: master
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: Aleksandar Karastoyanov
      email: karastoqnov.alexandar@gmail.com
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0
    install: |
      bin.install "nowctl"
    test: |
      system "#{bin}/nowctl --version"
