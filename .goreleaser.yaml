version: 2

project_name: nowctl

before:
  hooks:
    - go mod tidy

builds:
  - id: nowctl
    main: .
    binary: nowctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.date={{.Date}}

archives:
  - id: nowctl
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

nfpms:
  - id: nowctl
    package_name: nowctl
    formats:
      - deb
    maintainer: Aleksandar Karastoyanov <karastoqnov.alexandar@gmail.com>
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: karastoyanov
    name: NowControl
  header: |
    ## nowctl v{{ .Version }}

    Small cosmetic fix -- no functional CLI changes.

    **Changed:**
    - `--version` output simplified: drops the commit hash and reformats
      the build date from RFC3339 to `dd-MM-yyyy`, e.g.
      `nowctl version {{ .Version }} (built 25-07-2026)` instead of
      `nowctl version {{ .Version }} (commit abc1234..., built 2026-07-25T10:00:00Z)`.
  footer: |
    ---
    Full usage reference: [docs/USAGE.md](https://github.com/karastoyanov/NowControl/blob/v{{ .Version }}/docs/USAGE.md)

brews:
  - name: nowctl
    repository:
      owner: karastoyanov
      name: NowControl
      branch: master
      token: "{{ .Env.GITHUB_TOKEN }}"
    directory: Formula
    commit_author:
      name: Aleksandar Karastoyanov
      email: karastoqnov.alexandar@gmail.com
    homepage: https://github.com/karastoyanov/NowControl
    description: Cross-platform command-line interface for ServiceNow
    license: GPL-3.0
    install: |
      bin.install "nowctl"
    test: |
      system "#{bin}/nowctl --version"
